# Mosquitto MQTT Broker Configuration
# Port standard MQTT
listener 1883
allow_anonymous true

# WebSocket MQTT listener (utile pour dashboards web directs)
listener 9001
protocol websockets

# Persistance des messages et sessions
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Configuration Sécurisée TLS (à décommenter pour activation TLS 1.2+ CIS)
# listener 8883
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
# cafile /mosquitto/config/certs/ca.crt
# tls_version tlsv1.2
